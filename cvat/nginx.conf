# CVAT for Railway: the server's nginx, extended to also serve the web UI.
# Backend paths go to uvicorn (same routes as upstream's Traefik rules),
# everything else is the single-page UI from the cvat/ui image.
worker_processes auto;
pid /tmp/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
  worker_connections 512;
}

error_log /dev/stderr;

http {
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  proxy_temp_path    /tmp/nginx_proxy;
  uwsgi_temp_path    /tmp/nginx_uwsgi;
  scgi_temp_path     /tmp/nginx_scgi;
  fastcgi_temp_path  /tmp/nginx_fastcgi;
  client_body_temp_path /tmp/nginx_body;

  access_log off;

  map $upstream_http_referrer_policy $hdr_referrer_policy {
      '' "strict-origin-when-cross-origin";
  }
  map $upstream_http_x_content_type_options $hdr_x_content_type_options {
      '' "nosniff";
  }
  map $upstream_http_x_frame_options $hdr_x_frame_options {
      '' "deny";
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream uvicorn {
    server unix:/tmp/cvat/uvicorn.sock;
  }

  server {
    listen 8080;
    listen [::]:8080;
    client_max_body_size 1G;
    server_name _;
    server_tokens off;

    # Shared proxy settings for the backend locations below.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
    proxy_buffering on;
    proxy_buffers 16 8k;
    proxy_read_timeout 300s;

    location /static/ {
      gzip on;
      gzip_comp_level 6;
      gzip_http_version 1.1;
      gzip_types application/javascript application/x-javascript text/javascript application/wasm image/x-icon;
      alias /home/django/static/;
    }

    location /data/ {
      internal;
      alias /home/django/data/;
    }

    location ^~ /api/ {
      add_header Referrer-Policy $hdr_referrer_policy always;
      add_header X-Content-Type-Options $hdr_x_content_type_options always;
      add_header X-Frame-Options $hdr_x_frame_options always;
      proxy_pass http://uvicorn;
    }

    location ^~ /admin {
      add_header Referrer-Policy $hdr_referrer_policy always;
      add_header X-Content-Type-Options $hdr_x_content_type_options always;
      add_header X-Frame-Options $hdr_x_frame_options always;
      proxy_pass http://uvicorn;
    }

    location ^~ /django-rq {
      add_header Referrer-Policy $hdr_referrer_policy always;
      add_header X-Content-Type-Options $hdr_x_content_type_options always;
      add_header X-Frame-Options $hdr_x_frame_options always;
      proxy_pass http://uvicorn;
    }

    # Web UI (from cvat/ui's react_nginx.conf)
    root /opt/cvat-ui;
    gzip on;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_types application/javascript application/x-javascript text/javascript application/wasm image/x-icon;

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Cross-Origin-Opener-Policy "same-origin";
      add_header Cross-Origin-Embedder-Policy "credentialless";
      add_header Expires 0;
      add_header X-Frame-Options "deny";
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.map$ {
      return 404;
    }

    location /assets {
      expires 1y;
      add_header Cache-Control "public";
      add_header Cross-Origin-Embedder-Policy "require-corp";
      add_header Service-Worker-Allowed "/" always;
      include /etc/nginx/mime.types;
      types {
        # mjs modules must be application/javascript, not application/octet-stream
        application/javascript mjs;
      }
    }
  }
}
