; All CVAT processes in one container (Railway volumes can't be shared
; between services, and the server and workers share /home/django/data).
[include]
files = reusable/supervisord.conf reusable/nginx.conf reusable/smokescreen.conf reusable/rqscheduler.conf

[fcgi-program:uvicorn]
socket=unix:///tmp/cvat/uvicorn.sock
command=/opt/cvat/wait_for_deps.sh
    uvicorn
        --fd 0
        --forwarded-allow-ips='*'
        cvat.asgi:application
autorestart=true
environment=CVAT_EVENTS_LOCAL_DB_FILENAME="events_%(process_num)03d.db",CVAT_POSTGRES_APPLICATION_NAME="cvat:server"
numprocs=%(ENV_NUMPROCS)s
process_name=%(program_name)s-%(process_num)d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opa]
command=/usr/local/bin/opa run --server --addr=127.0.0.1:8181 --log-level=error
    --set=services.cvat.url=http://127.0.0.1:8080
    --set=bundles.cvat.service=cvat
    --set=bundles.cvat.resource=/api/auth/rules
    --set=bundles.cvat.polling.min_delay_seconds=5
    --set=bundles.cvat.polling.max_delay_seconds=15
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-import]
command=/opt/cvat/wait_for_deps.sh django-admin rqworker -v 1 import --with-scheduler --worker-class=cvat.rqworker.DefaultWorker
environment=VECTOR_EVENT_HANDLER="SynchronousLogstashHandler",CVAT_POSTGRES_APPLICATION_NAME="cvat:worker:import"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-export]
command=/opt/cvat/wait_for_deps.sh django-admin rqworker -v 1 export --with-scheduler --worker-class=cvat.rqworker.DefaultWorker
environment=VECTOR_EVENT_HANDLER="SynchronousLogstashHandler",CVAT_POSTGRES_APPLICATION_NAME="cvat:worker:export"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-chunks]
command=/opt/cvat/wait_for_deps.sh django-admin rqworker -v 1 chunks --worker-class=cvat.rqworker.DefaultWorker
environment=VECTOR_EVENT_HANDLER="SynchronousLogstashHandler",CVAT_POSTGRES_APPLICATION_NAME="cvat:worker:chunks"
numprocs=2
process_name=%(program_name)s-%(process_num)d
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-annotation]
command=/opt/cvat/wait_for_deps.sh django-admin rqworker -v 1 annotation --worker-class=cvat.rqworker.DefaultWorker
environment=VECTOR_EVENT_HANDLER="SynchronousLogstashHandler",CVAT_POSTGRES_APPLICATION_NAME="cvat:worker:annotation"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-webhooks]
command=/opt/cvat/wait_for_deps.sh django-admin rqworker -v 1 webhooks --with-scheduler --worker-class=cvat.rqworker.DefaultWorker
environment=VECTOR_EVENT_HANDLER="SynchronousLogstashHandler",CVAT_POSTGRES_APPLICATION_NAME="cvat:worker:webhooks"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-utils]
command=/opt/cvat/wait_for_deps.sh django-admin rqworker -v 1 quality_reports consensus notifications cleaning --worker-class=cvat.rqworker.DefaultWorker
environment=VECTOR_EVENT_HANDLER="SynchronousLogstashHandler",CVAT_POSTGRES_APPLICATION_NAME="cvat:worker:utils"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
